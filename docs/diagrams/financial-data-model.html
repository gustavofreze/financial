<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Financial data model</title>
  <!-- Drawn with the diagram-design skill, Skedli palette (white canvas variant). Export the README SVG from
       skedli-context with python3 helpers/diagram_export.py <this file>, which runs the skill's export_svg.py
       and outlines every text as a path, so the image depends on no font. -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-ink: #011f51; --color-muted: #3f4a66;
      --font-sans: 'Nunito', 'Nunito Variable', system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body { font-family: var(--font-sans); background: #ffffff; color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: 0.8rem; font-weight: 600; color: var(--color-muted); margin-bottom: 0.25rem; }
    h1 { font-size: 1.6rem; font-weight: 700; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1072px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>

    <p class="eyebrow">financial · data model</p>
    <h1>Financial data model</h1>

        <title id="financial-data-model-title">Financial data model</title>
        <desc id="financial-data-model-desc">The PostgreSQL tables, one schema per bounded context: the append only event store of bookkeeping, captured by Debezium, and the balances, the adjustments that make the balance adjustment idempotent, and the troubleshooting queue of account. No foreign key crosses the schemas: the transaction id reaches account only through the TransactionRegistered event.</desc>

          <marker id="arrow-sync" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#2e58d6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>

        </defs>

        <text x="489" y="90" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">schema</text>
