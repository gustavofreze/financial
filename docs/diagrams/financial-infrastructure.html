        <desc id="financial-infrastructure-desc">The containers of the local stack: the app runs the console use cases and the Kafka Streams platform, financial-migrate applies the Flyway migrations once, PostgreSQL writes every insert to its write-ahead log, Kafka Connect decodes that log through Debezium and publishes each TransactionRegistered to the Kafka broker as Avro, with the schemas in Schema Registry, and the platform consumes that topic.</desc>
